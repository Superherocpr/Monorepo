version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
            # AWS Amplify Hosting does NOT pass non-NEXT_PUBLIC_* env vars to the
            # Next.js SSR Lambda at runtime — only at build time. To make server-only
            # secrets (e.g. SUPABASE_SERVICE_ROLE_KEY, ZOHO_CLIENT_SECRET) available
            # to Server Components and API routes at runtime, we must write them into
            # .env.production during the build so Next.js inlines them into the
            # standalone server bundle. Without this, createAdminClient() and any
            # other code that reads server-only env vars throws at runtime.
            - |
              echo "Writing server-side env vars to .env.production for SSR runtime..."
              # NOTE: prefix-style entries (NEXT_PUBLIC_, PAYPAL_, S3_, AWS_S3_, TWILIO_)
              # must NOT have "=" anchored to them here — "=" only belongs after an
              # EXACT var name. Anchoring "=" to the whole alternation group (the old
              # bug) silently matched zero vars for every prefix entry, since e.g.
              # "PAYPAL_" required the literal var name "PAYPAL_" with nothing after it.
              # Found 2026-07-13 after PAYPAL_*, S3_BUCKET_NAME, and NEXT_PUBLIC_* were
              # missing from every prod build despite being set correctly in Amplify.
              env | grep -E '^(NEXT_PUBLIC_|PAYPAL_|S3_|AWS_S3_|TWILIO_|DATAFORSEO_|SUPABASE_SERVICE_ROLE_KEY=|OWNER_EMAIL=|FACEBOOK_PAGE_ID=|FACEBOOK_PAGE_ACCESS_TOKEN=|PLATFORM_FEE_PERCENT=|ZOHO_CLIENT_ID=|ZOHO_CLIENT_SECRET=|ZOHO_REDIRECT_URI=|RESEND_API_KEY=|RESEND_FROM_EMAIL=|CRON_SECRET=|GOOGLE_PLACES_API_KEY=|TURNSTILE_SECRET_KEY=|MOCK_PAYMENTS=)' >> .env.production
              echo "Wrote $(wc -l < .env.production) env var lines (values redacted)."
              # Names-only guard against a future regression of the bug above —
              # e.g. adding a new prefix entry with a trailing "=" by mistake.
              echo "Env var names written: $(cut -d= -f1 < .env.production | sort | tr '\n' ' ')"
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
